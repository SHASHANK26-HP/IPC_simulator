<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>IPC Studio – Linux Inter-Process Communication Simulator</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--ink:#0f172a;--mut:#64748b;--line:#cbd5e1;--acc:#0284c7;--ok:#16a34a;--warn:#d97706;--bad:#dc2626;--code:#0f172a;--codeink:#e2e8f0;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1120;--card:#162033;--ink:#f1f5f9;--mut:#94a3b8;--line:#334155;--acc:#38bdf8;--ok:#4ade80;--warn:#fbbf24;--bad:#f87171;--code:#020617}}
:root[data-theme="dark"]{--bg:#0b1120;--card:#162033;--ink:#f1f5f9;--mut:#94a3b8;--line:#334155;--acc:#38bdf8;--ok:#4ade80;--warn:#fbbf24;--bad:#f87171;--code:#020617}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;padding:16px;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;max-width:980px;margin-inline:auto}
h1{margin:0 0 4px;font-size:1.5rem}h1 span{color:var(--acc)}
p.sub{margin:0 0 14px;color:var(--mut);font-size:.92rem}
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tabs button,.ctl button{padding:9px 14px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;font-weight:600;cursor:pointer}
.tabs button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-top:12px}
.story{font-size:.95rem;line-height:1.5}
.ctl{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.ctl input[type=text],.ctl input[type=number]{padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);width:130px}
.ctl button.go{background:var(--ok);color:#06280f;border-color:var(--ok)}
.ctl label{font-size:.85rem;color:var(--mut)}
#stage{position:relative;display:flex;flex-wrap:wrap;gap:14px;justify-content:space-between;padding:12px 0 8px;min-height:190px}
.node{flex:1;min-width:140px;border:2px solid var(--line);border-radius:14px;padding:12px;text-align:center;background:var(--bg);transition:.35s;position:relative}
.node.hi{border-color:var(--acc);box-shadow:0 0 16px color-mix(in srgb,var(--acc) 45%,transparent);transform:translateY(-4px)}
.node .em{font-size:2rem;line-height:1.1}
.node b{display:block;margin-top:2px}
.node small{display:block;color:var(--mut);margin-top:4px;min-height:2.4em;font-size:.8rem}
.tag{display:inline-block;font-size:.7rem;padding:2px 8px;border-radius:99px;background:var(--line);margin-top:4px;font-weight:700}
.tag.ok{background:var(--ok);color:#06280f}.tag.bad{background:var(--bad);color:#fff}.tag.warn{background:var(--warn);color:#2a1a00}
.hide{opacity:.18;filter:grayscale(1)}
.chip{position:absolute;z-index:5;padding:3px 7px;border-radius:6px;background:var(--acc);color:#fff;font:700 13px monospace;pointer-events:none;transition:transform .8s cubic-bezier(.5,0,.3,1),opacity .3s}
.chip.n{background:var(--warn);color:#2a1a00}.chip.bad{background:var(--bad)}
.pipebar{height:14px;margin-top:8px;border-radius:99px;background:linear-gradient(90deg,var(--line),var(--bg));border:1px solid var(--line);overflow:hidden;display:flex;gap:2px;padding:1px}
.pipebar i{flex:1;max-width:14px;border-radius:99px;background:var(--acc)}
.lock{font-size:2rem;transition:.3s}
.row{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:760px){.row{grid-template-columns:1.1fr .9fr}}
pre{margin:0;background:var(--code);color:var(--codeink);border-radius:10px;padding:10px 0;font:12.5px/1.65 ui-monospace,Consolas,monospace;overflow-x:auto}
pre div{padding:0 12px;white-space:pre;border-left:3px solid transparent;opacity:.55}
pre div.on{opacity:1;background:rgba(56,189,248,.18);border-left-color:#38bdf8}
#log{font:13px/1.6 ui-monospace,Consolas,monospace;max-height:230px;overflow:auto}
#log div{padding:3px 0;border-bottom:1px dashed var(--line)}
.prog{height:6px;background:var(--line);border-radius:9px;overflow:hidden;margin-top:6px}.prog i{display:block;height:100%;width:0;background:var(--acc);transition:.4s}
</style>
</head>
<body>
<h1>⚙️ IPC <span>Studio</span></h1>
<p class="sub">Watch how Linux processes talk to each other: <b>fork()</b> · <b>pipe()</b> · <b>mmap()</b> · <b>semaphores</b></p>

<div class="tabs">
  <button id="t0" class="on" onclick="load(0)">📬 Pipe (message passing)</button>
  <button id="t1" onclick="load(1)">🧠 Shared memory + semaphore</button>
</div>

<div class="card story" id="story"></div>

<div class="card">
  <div class="ctl" id="inputs"></div>
  <div class="ctl">
    <button class="go" onclick="auto()">▶ Auto play</button>
    <button onclick="next()">⏭ Next step</button>
    <button onclick="load(mode)">↺ Reset</button>
    <label>Speed <input type="range" id="spd" min="400" max="2200" value="1200" style="vertical-align:middle"></label>
  </div>
  <div class="prog"><i id="bar"></i></div>
  <div id="stage"></div>
</div>

<div class="row">
  <div class="card" style="margin-top:0"><b>C code (live)</b><div style="height:8px"></div><pre id="code"></pre></div>
  <div class="card" style="margin-top:0"><b>What’s happening</b><div style="height:8px"></div><div id="log"></div></div>
</div>

<script>
const $=id=>document.getElementById(id), wait=ms=>new Promise(r=>setTimeout(r,ms));
let mode=0, idx=0, busy=false, playing=false, S=[];

const MODES=[{
 story:"📬 <b>Analogy:</b> a pipe is a <b>one-way tube</b>. The parent drops letters in one end (<code>fd[1]</code>), the kernel holds them, and the child picks them up from the other end (<code>fd[0]</code>). Bytes come out in the same order they went in (FIFO).",
 inputs:'<input id="a" type="text" value="Hello Child!" maxlength="14"> <small style="color:var(--mut)">message</small>',
 code:["int fd[2]; pipe(fd);","pid_t pid = fork();","if (pid > 0) {   // PARENT","  close(fd[0]);","  write(fd[1], msg, len);","  close(fd[1]); wait(NULL);","} else {         // CHILD","  close(fd[0]) → close(fd[1]);","  read(fd[0], buf, size);","}"],
 nodes:'<div class="node" id="P"><div class="em">👨</div><b>Parent</b><span class="tag" id="Pt">idle</span><small id="Ps"></small></div><div class="node" id="K"><div class="em">🚰</div><b>Kernel pipe</b><span class="tag">FIFO buffer</span><div class="pipebar" id="pb"></div><small id="Ks">not created</small></div><div class="node hide" id="C"><div class="em">🧒</div><b>Child</b><span class="tag" id="Ct">not born</span><small id="Cs"></small></div>',
 steps:[
  [0,"pipe(fd) → kernel creates a buffer and gives 2 file descriptors: fd[0]=read end, fd[1]=write end.",async()=>{hi('K');$('Ks').innerHTML='fd[0] 👁 read · fd[1] ✍ write'}],
  [1,"fork() → the process clones itself! The child inherits copies of BOTH fds.",async()=>{hi('P');$('C').classList.remove('hide');$('Ct').textContent='born (copy)';$('Cs').textContent='has fd[0] & fd[1]';$('Pt').textContent='parent';await wait(300);hi('C')}],
  [3,"Parent only writes, so it closes the unused read end fd[0]. (Good hygiene!)",async()=>{hi('P');$('Ps').textContent='fd[0] closed ✖'}],
  [7,"Child only reads, so it closes the unused write end fd[1]. Without this, read() would never see end-of-file.",async()=>{hi('C');$('Cs').textContent='fd[1] closed ✖'}],
  [4,"write(fd[1]) → each byte flies into the kernel buffer.",async()=>{hi('P');$('Pt').textContent='writing…';const m=val('a','Hello');for(const ch of m){fly(ch,'P','K');await wait(140);fill(1)}$('Ks').textContent=`buffer holds ${m.length} bytes`}],
  [8,"read(fd[0]) → child pulls the bytes out, in the same order. If the pipe were empty, child would BLOCK (sleep).",async()=>{hi('C');$('Ct').textContent='reading…';const m=val('a','Hello');for(const ch of m){fly(ch,'K','C');await wait(140);fill(-1)}$('Cs').innerHTML=`got: <b>"${m}"</b>`;$('Ks').textContent='buffer empty';$('Ct').className='tag ok';$('Ct').textContent='received ✔'}],
  [5,"Parent closes fd[1] and wait()s for the child. Pipe destroyed – nothing left behind. 🎉",async()=>{hi('P');$('Pt').className='tag ok';$('Pt').textContent='done ✔';$('Ps').textContent='pipe closed'}]
 ]},{
 story:"🧠 <b>Analogy:</b> shared memory is a <b>whiteboard</b> both processes can see — the fastest IPC, no copying through the kernel. But two people writing/reading at once make a mess (a <b>race condition</b>), so a <b>semaphore</b> acts like a door lock: the reader waits until the writer says <i>“done!”</i>.",
 inputs:'<input id="a" type="text" value="Shashank" maxlength="12"> <input id="b" type="number" value="179"> <label><input type="checkbox" id="nosem"> ❌ Disable semaphore (show the bug)</label>',
 code:["shm = mmap(NULL, size, PROT_READ|PROT_WRITE,","        MAP_SHARED|MAP_ANONYMOUS, -1, 0);","sem_init(&shm->sem, 1, 0);   // starts LOCKED","pid_t pid = fork();","child:  sem_wait(&shm->sem);  // blocks","parent: strcpy(shm->message, text);","parent: shm->secret_code = num;","parent: sem_post(&shm->sem);  // unlock!","child:  printf(shm->message, shm->secret_code);","sem_destroy(); munmap(shm, size);"],
 nodes:'<div class="node" id="P"><div class="em">✍️</div><b>Parent (writer)</b><span class="tag" id="Pt">idle</span><small id="Ps"></small></div><div class="node hide" id="M"><div class="em">🧠</div><b>Shared RAM</b><span class="tag">mmap region</span><small id="Ms">not mapped</small></div><div class="node hide" id="L"><div class="em lock" id="lk">🔒</div><b>Semaphore</b><span class="tag warn" id="Lt">value 0</span><small id="Ls"></small></div><div class="node hide" id="C"><div class="em">📖</div><b>Child (reader)</b><span class="tag" id="Ct">not born</span><small id="Cs"></small></div>',
 steps:[
  [0,"mmap(MAP_SHARED | MAP_ANONYMOUS) → kernel reserves a RAM block that will be visible to parent AND child.",async()=>{$('M').classList.remove('hide');hi('M');$('Ms').textContent='empty: "" | 0'}],
  [2,"sem_init(value=0) → semaphore starts at 0 = door LOCKED. Any sem_wait() will sleep.",async()=>{$('L').classList.remove('hide');hi('L');$('Ls').textContent='pshared=1 (across processes)'}],
  [3,"fork() → child is created and shares the same mapped memory (not a copy!).",async()=>{hi('P');$('C').classList.remove('hide');$('Ct').textContent='born';await wait(300);hi('C')}],
  [4,null,async()=>{hi('C');if($('nosem').checked){$('Ct').className='tag bad';$('Ct').textContent='NO WAIT!';log0('⚠️ No semaphore: child reads immediately…');fly('?','M','C','bad');await wait(700);$('Cs').innerHTML='read garbage: <b>"" | 0</b> 💥';$('Ms').textContent='(still empty!)'}else{$('Ct').className='tag warn';$('Ct').textContent='😴 sleeping';$('Cs').textContent='blocked in sem_wait()'}}],
  [5,"Parent writes the text into shared RAM.",async()=>{hi('P');$('Pt').textContent='writing…';const m=val('a','Data');for(const ch of m){fly(ch,'P','M');await wait(110)}$('Ms').innerHTML=`"${m}" | …`}],
  [6,"Parent writes the number into shared RAM.",async()=>{hi('P');const n=val('b','0');fly(n,'P','M','n');await wait(800);$('Ms').innerHTML=`"${val('a','Data')}" | ${n}`}],
  [7,"sem_post() → semaphore goes 0 → 1, door UNLOCKED. The sleeping child wakes up.",async()=>{hi('L');$('lk').textContent='🔓';$('Lt').className='tag ok';$('Lt').textContent='value 1';$('Ls').textContent='parent called sem_post()'}],
  [8,null,async()=>{hi('C');const nos=$('nosem').checked;if(!nos){fly(val('a','Data'),'M','C');fly(val('b','0'),'M','C','n');await wait(900);$('Ct').className='tag ok';$('Ct').textContent='read ✔';$('Cs').innerHTML=`<b>"${val('a','Data')}" | ${val('b','0')}</b>`}else{$('Cs').innerHTML+='<br>(too late – already read garbage)'}}],
  [9,"Cleanup: sem_destroy() and munmap() release everything. 🎉",async()=>{hi('P');$('Pt').className='tag ok';$('Pt').textContent='done ✔';$('Ps').textContent='memory unmapped'}]
 ]}];

const val=(id,d)=>($(id)&&String($(id).value).trim())||d;
const log0=t=>{const d=document.createElement('div');d.innerHTML=t;$('log').prepend(d)};
function hi(id){document.querySelectorAll('.node').forEach(n=>n.classList.remove('hi'));$(id).classList.add('hi')}
function fill(d){const pb=$('pb');if(d>0){const i=document.createElement('i');pb.appendChild(i)}else pb.lastChild&&pb.lastChild.remove()}
function fly(t,a,b,cls=''){const st=$('stage'),sr=st.getBoundingClientRect(),A=$(a).getBoundingClientRect(),B=$(b).getBoundingClientRect();
 const c=document.createElement('span');c.className='chip '+cls;c.textContent=t;
 c.style.left=(A.left-sr.left+A.width/2-10)+'px';c.style.top=(A.top-sr.top+A.height/2-10)+'px';st.appendChild(c);
 requestAnimationFrame(()=>requestAnimationFrame(()=>{c.style.transform=`translate(${B.left-A.left}px,${B.top-A.top}px)`}));
 setTimeout(()=>{c.style.opacity=0},780);setTimeout(()=>c.remove(),1100)}

function load(m){mode=m;idx=0;busy=false;playing=false;const M=MODES[m];
 $('t0').classList.toggle('on',m==0);$('t1').classList.toggle('on',m==1);
 $('story').innerHTML=M.story;$('inputs').innerHTML=M.inputs;$('stage').innerHTML=M.nodes;
 $('code').innerHTML=M.code.map((l,i)=>`<div id="c${i}">${l.replace(/</g,'&lt;')}</div>`).join('');
 $('log').innerHTML='<div>Press <b>Auto play</b> or step through one action at a time ▶</div>';$('bar').style.width='0'}
async function next(){const M=MODES[mode];if(busy||idx>=M.steps.length)return false;busy=true;
 const [line,txt,fn]=M.steps[idx];
 document.querySelectorAll('#code div').forEach(d=>d.classList.remove('on'));$('c'+line).classList.add('on');
 let t=txt;if(!t){t=(mode==1&&idx==3)?($('nosem').checked?null:"Child calls sem_wait() → value is 0, so the child goes to sleep (no CPU wasted)."):($('nosem').checked?"Child already read — nothing to wait for.":"Child wakes, and reads the finished data directly from shared RAM. No copying!")}
 if(t)log0(`<b>Step ${idx+1}:</b> ${t}`);
 idx++;$('bar').style.width=(idx/M.steps.length*100)+'%';
 await fn();await wait(300);busy=false;return true}
async function auto(){if(playing)return;if(idx>=MODES[mode].steps.length)load(mode);playing=true;
 while(playing&&await next())await wait(+$('spd').value);playing=false}
load(0);
</script>
</body>
</html>
